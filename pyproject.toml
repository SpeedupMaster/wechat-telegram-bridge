[project]
name = "wechat-telegram-bridge"
version = "1.0.0"
description = "Bidirectional WeChat (agent-wechat) <-> Telegram (Telethon MTProto) bridge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.40,<2",
    "httpx>=0.27",
    "curl_cffi>=0.10",
    "aiohttp>=3.10",
    "python-socks[asyncio]>=2.4",
    "cryptg>=0.4",
    "segno>=1.6",
    "Pillow>=11",
    "rlottie-python>=1.3.8",
]

[project.scripts]
wechat-telegram-bridge = "bridge.__main__:main"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["bridge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # long Chinese UI copy / inline HTML snippets
    "E701",  # compact one-line guards
    "E702",  # compact semicolon statements where intentional
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"bridge/core.py" = ["F401"]  # compatibility re-exports from formatting/calls/emojis
"tests/test_bridge.py" = ["F401"]  # compatibility re-exports from tests.fakes
