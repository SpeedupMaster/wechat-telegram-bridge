# WeChat <-> Telegram on one Linux VPS.
#
#   cp .env.example .env    # fill in TG_API_ID, TG_API_HASH, TG_BOT_TOKEN
#   docker compose up -d
#   docker compose logs telegram-bridge     # shows the pairing code; send "/login CODE" to your bot
#
# (or just run ./setup.sh, which does all of the above)
#
# Both long-running containers use host networking: the agent-wechat API stays on
# 127.0.0.1:6174 (never exposed to the internet) and the bridge reaches it there.
# No ports are published.

services:
  # One-shot, runs before the others on every start:
  #  - creates the agent-wechat API token the first time (kept in ./data/wechat-token).
  #    The daemon refuses token files that other users can read, so each side gets its own copy.
  #  - writes the agent-wechat server config (same as upstream deploy/native/server.toml:
  #    API on loopback only) into ./data/wechat-config. agent-wechat runs with a read-only
  #    filesystem, so this is mounted as a bind directory rather than a Compose config or a host file.
  #  - ensures host bind-mount directories are owned by the right container UIDs (10001 / 10002).
  token-init:
    image: busybox:1.37
    network_mode: none
    volumes:
      - ./data/wechat-token:/token
      - ./data/wechat-config:/config
      - ./data/wechat-data:/wechat-data
      - ./data/wechat-scratch:/wechat-scratch
      - ./data/bridge-data:/bridge-data
    command:
      - sh
      - -ec
      - |
        umask 077
        if [ ! -s /token/daemon-token ]; then
          head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /token/daemon-token
          echo "created a new agent-wechat API token"
        fi
        cp /token/daemon-token /token/bridge-token
        chown 10001:10001 /token/daemon-token
        chown 10002:10002 /token/bridge-token
        chmod 600 /token/daemon-token /token/bridge-token
        chmod 755 /token
        # agent-wechat may already be running (compose only reruns this job), and SQLite
        # creates and deletes its -wal/-shm files at any moment. A plain `chown -R` then
        # fails on a file that vanished mid-walk, aborting the deploy. So only touch
        # entries with the wrong owner (the daemon's own files never qualify), and treat
        # leftover errors as warnings instead of failing the whole stack.
        fix_owner() {
          id=$$1; shift
          find "$$@" \( ! -user "$$id" -o ! -group "$$id" \) -exec chown -h "$$id:$$id" {} + \
            || echo "warning: could not fix ownership of some files under $$* (in use or vanished?)"
        }
        fix_owner 10001 /wechat-data /wechat-scratch
        fix_owner 10002 /bridge-data
        {
          echo 'schemaVersion = 1'
          echo 'listen = "127.0.0.1:6174"'
          echo 'dataDir = "/var/lib/agent-wechat"'
          echo 'tokenFile = "/token/daemon-token"'
        } > /config/config.toml
        chmod 644 /config/config.toml
        chmod 755 /config
    restart: "no"

  agent-wechat:
    image: ghcr.io/thisnick/agent-wechat-native:${AGENT_WECHAT_VERSION:-latest}
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      # lets `docker compose exec agent-wechat wx ...` talk to this daemon without extra flags
      AGENT_WECHAT_URL: http://127.0.0.1:6174
      AGENT_WECHAT_TOKEN_FILE: /token/daemon-token
    volumes:
      - ./data/wechat-data:/var/lib/agent-wechat
      - ./data/wechat-scratch:/var/cache/agent-wechat
      - ./data/wechat-token:/token:ro
      - ./data/wechat-config:/etc/agent-wechat/server:ro
    depends_on:
      token-init:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  telegram-bridge:
    # Built by GitHub Actions (.github/workflows/image.yml). The image is private, so run
    # `docker login ghcr.io` once on the VPS (see README). Without that, `docker compose up -d --build`
    # builds it locally from this directory instead.
    image: ${BRIDGE_IMAGE:-ghcr.io/speedupmaster/wechat-telegram-bridge:latest}
    build: .
    network_mode: host
    environment:
      TG_API_ID: ${TG_API_ID:?set TG_API_ID in .env}
      TG_API_HASH: ${TG_API_HASH:?set TG_API_HASH in .env}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:?set TG_BOT_TOKEN in .env}
      TG_PROXY: ${TG_PROXY:-}
      BRIDGE_MODE: ${BRIDGE_MODE:-}
      TG_FORUM_CHAT: ${TG_FORUM_CHAT:-}
      # optional: answer WeChat calls in a Telegram Mini App. The page listens on CALL_WEB_LISTEN
      # (loopback by default); put an HTTPS reverse proxy for CALL_WEB_URL in front of it (see README).
      CALL_WEB_URL: ${CALL_WEB_URL:-}
      CALL_WEB_LISTEN: ${CALL_WEB_LISTEN:-}
      CALL_WEB_APP: ${CALL_WEB_APP:-}
      AUTO_RELOGIN: ${AUTO_RELOGIN:-}
      WECHAT_URL: http://127.0.0.1:6174
      WECHAT_TOKEN_FILE: /token/bridge-token
    volumes:
      - ./data/bridge-data:/app/data
      - ./data/wechat-token:/token:ro
      # optional: put a config.toml with advanced settings here (see config.example.toml)
      - ./config:/app/config:ro
    depends_on:
      token-init:
        condition: service_completed_successfully
      agent-wechat:
        condition: service_started
    restart: unless-stopped

  # Optional: Cloudflare Tunnel in front of the call answering page (CALL_WEB_URL), instead of
  # Caddy/nginx. Needs no open ports and no certificate on the VPS. Turn it on with
  # COMPOSE_PROFILES=cloudflare and CF_TUNNEL_TOKEN in .env, and point the tunnel's public
  # hostname at http://127.0.0.1:8780 in the Cloudflare dashboard (see README).
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    profiles: [cloudflare]
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      telegram-bridge:
        condition: service_started
    restart: unless-stopped
