# 可选的高级设置。所有项都有默认值，不需要这个文件也能运行。
#   Docker：复制到 config/config.toml，然后 docker compose restart telegram-bridge
#   本地运行：复制到项目根目录的 config.toml
# 环境变量（.env）会覆盖这里的同名设置：TG_API_ID、TG_API_HASH、TG_BOT_TOKEN、TG_PROXY、
# WECHAT_URL、WECHAT_TOKEN、WECHAT_TOKEN_FILE、WECHAT_ACCOUNT、BRIDGE_DATA_DIR、BRIDGE_MODE、TG_FORUM_CHAT、
# BRIDGE_OFFICIAL_ACCOUNTS、TG_OA_FORUM_CHAT、EMOJI_TO_WECHAT、AUTO_RELOGIN

[wechat]
# agent-wechat 守护进程（wx serve）的地址。用本项目的 compose.yaml 部署时不用填
# base_url = "http://127.0.0.1:6174"
# 守护进程的 API token（或 token_file = token 文件路径）。Docker 部署时自动生成，不用填
# token = ""
# 留空 = 自动使用唯一的账号（没有账号时自动创建）；守护进程里有多个账号时填账号 ID 或别名
# account = ""
# 在守护进程里登记的消费者名，用于记录读到哪条事件
# consumer = "telegram-bridge"

[telegram]
# 一般写在 .env 里（TG_API_ID / TG_API_HASH / TG_BOT_TOKEN）
# api_id = 0
# api_hash = ""
# bot_token = ""
# 海外 VPS 留空。国内网络需要代理才能连 Telegram，例如 "socks5://127.0.0.1:7890" 或 "http://127.0.0.1:7890"
# proxy = ""

[bridge]
# 数据目录（数据库、Telegram 登录会话），相对于本文件。Docker 里固定为 /app/data
# data_dir = "data"
# 使用方式（环境变量 BRIDGE_MODE）：
#   "groups" = 每个微信会话一个 Telegram 群，由你的 Telegram 账号自动建群
#   "topics" = 一个开启了「话题」的群，每个微信会话一个话题，只用机器人（机器人需是群管理员并有「管理话题」权限）
# mode = "groups"
# topics 模式的话题群 ID（环境变量 TG_FORUM_CHAT，-100 开头）；0 = 在群里发 /forum 指定
# forum_chat = 0
# Telegram 群名（topics 模式下为话题名）模板，{name} = 微信备注名/昵称/群名
title_direct = "{name}"
title_group = "👥 {name}"
# 是否桥接微信群聊
bridge_groups = true
# 是否桥接公众号/服务号消息（环境变量 BRIDGE_OFFICIAL_ACCOUNTS）
bridge_official_accounts = true
# 可选：将公众号/服务号单独收进一个开启了「话题」的超级群（环境变量 TG_OA_FORUM_CHAT，-100 开头）
# 每个公众号/服务号自动生成一个独立话题（机器人需为群管理员且有「管理话题」权限）；
# 设为 0 表示未固定，也可直接在该话题群里发 /oaforum 绑定（发 /oaforum off 取消）
# official_accounts_forum_chat = 0
# 在手机微信上发出的消息，是否也同步到 Telegram 群（显示为“我（手机端）”）
forward_outgoing = true
# 上面这类同步消息静音发送，不触发通知
outgoing_silent = true
# 建群时把微信头像设为群头像（topics 模式下话题没有头像，此项无效）
sync_avatar = true
# 在 Telegram 回复后，把对应微信会话标记为已读
mark_read_on_reply = true
# 两次自动建群之间至少间隔多少秒，降低触发 Telegram 频率限制的风险
create_interval_seconds = 20
# 单个媒体文件的大小上限（MB），两个方向都适用
max_media_mb = 200
# 实时转发微信语音/视频来电通知，并提供一键拒接按钮（需 agent-wechat >= 2.4.0）
call_notifications = true
# 在 Telegram 里接听微信语音通话（环境变量 CALL_WEB_URL / CALL_WEB_LISTEN / CALL_WEB_APP）：
#   call_web_url    通话页面的公网 HTTPS 地址（反向代理到 call_web_listen），留空 = 关闭接听，只保留拒接
#   call_web_listen 通话页面在本机监听的地址
#   call_web_app    可选：@BotFather /newapp 创建的 Mini App 短名称，填了以后按钮以 Mini App 方式打开
# call_web_url = "https://call.example.com"
# call_web_listen = "127.0.0.1:8780"
# call_web_app = ""
# 将微信链接分享（小红书、公众号、抖音/抖音极速版口令、网页等）渲染为微信风格卡片图并附带直达按钮
link_card_images = true
# 公众号文章卡片的按钮改为在内置阅读页（Mini App）中打开：不再弹「打开此链接？」确认，页面里可再点「打开原文」
# 需要同时配置 call_web_url 与 call_web_app；关闭后按钮仍直接打开原文链接
article_reader = true
# 小红书笔记卡片同样走内置阅读页：视频直接内嵌播放、图文按原图展示；收到卡片时即预抓取（分享链接的 xsec_token 会过期）
# 服务器被小红书拦截（登录墙、链接过期）时，Mini App 会在应用内原地打开原笔记
xhs_reader = true
# 可选：仅用于抓取公众号文章 / 小红书笔记的独立代理（环境变量 ARTICLE_PROXY），与 [telegram].proxy 相互独立
# 支持 http://、https://、socks5://、socks5h://；留空则直连（遇微信「环境异常」时 Mini App 会自动在应用内跳转原文）
# article_proxy = ""
# 把收到的微信好友请求推送到与机器人的私聊，可一键通过（需 agent-wechat >= 2.7.0）
friend_requests = true
# 微信备注 / 群名变化后自动更新 Telegram 群或话题标题（关闭后可在群里发 /rename 手动同步）
auto_rename = true
# 将 Telegram 发送的 GIF 动图转为微信表情包发送（需 agent-wechat >= 2.4.0，失败时自动回退为视频）
gif_as_sticker = true
# 可选：将 Telegram 发送的常见 Unicode Emoji 反向转为微信自带小黄脸代码（环境变量 EMOJI_TO_WECHAT，默认关闭）
#   例如 😁 → [呲牙]、🤦‍♂️/🤦 → [捂脸]、🫡 → [社会社会]；关闭时原样发送 Unicode Emoji
emoji_to_wechat = false
# 可选：微信掉线/退出登录后自动尝试重新登录一次（环境变量 AUTO_RELOGIN，默认关闭）
#   前提：需先在手机微信中为本设备开启「自动登录该设备」
#   防风控机制：检测到掉线后先随机延迟一段时间再发起单次登录；失败/需扫码/超时会立即取消并提醒手动登录，
#   不会循环重试；两次自动登录尝试之间有冷却时间保护（重启也生效）；等待期间也可点按钮取消或立即手动登录
auto_relogin = false
# 自动登录前的随机拟人延迟范围（秒），默认 45~180 秒
# auto_relogin_delay_min = 45
# auto_relogin_delay_max = 180
# 单次自动登录等待静默完成的超时时间（秒），超时未成功则取消并提醒手动登录
# auto_relogin_timeout_seconds = 60
# 两次自动登录尝试之间的最小冷却时间（秒），默认 3600 秒（1 小时），防止短时间反复掉线触发风控
# auto_relogin_cooldown_seconds = 3600
# 不桥接的微信会话 ID，例如 ["filehelper", "weixin"]
skip_threads = ["weixin"]
